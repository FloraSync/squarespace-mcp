name: Release

on:
  push:
    tags:
      - v*

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  publish-npm:
    name: Publish npm package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use npm with trusted publishing support
        run: npm install --global npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Read and validate version
        id: package
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          test "$(node -p 'require("./server.json").version')" = "${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Verify release candidate
        run: npm run release:dry

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check for an existing identical publication
        id: registry
        run: |
          PACKAGE_NAME="$(node -p 'require("./package.json").name')"
          VERSION="${{ steps.package.outputs.version }}"
          if PUBLISHED_GIT_HEAD="$(npm view "${PACKAGE_NAME}@${VERSION}" gitHead 2>/dev/null)"; then
            test "${PUBLISHED_GIT_HEAD}" = "${GITHUB_SHA}"
            echo "published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "published=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish to npm
        if: steps.registry.outputs.published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

  publish-container:
    name: Publish container
    needs: publish-npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/florasync/squarespace-mcp:${{ needs.publish-npm.outputs.version }}
            ghcr.io/florasync/squarespace-mcp:latest

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag
